<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember &amp; Oak Burger Co. – Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bitter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --char: #26180f;
    --oak: #4a2f1c;
    --oak-light: #5d3b24;
    --kraft: #cfae80;
    --kraft-light: #dcc196;
    --mustard: #e3a62a;
    --pickle: #4f5d26;
    --ketchup: #9c2c1b;
    --ink: #2b1d14;
    --display: "Alfa Slab One", "Rockwell", "Georgia", serif;
    --body: "Bitter", "Georgia", serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--body);
    font-size: 1.0625rem;
    line-height: 1.55;
    color: var(--ink);
    background-color: var(--oak);
    /* wooden planks */
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 2px, transparent 2px 120px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 3px, rgba(0,0,0,.03) 3px 6px);
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--mustard); outline-offset: 3px; }

  /* ---------- Header ---------- */
  .top {
    background: var(--char);
    color: var(--kraft-light);
    padding: 2.5rem 1.25rem 2rem;
    text-align: center;
    border-bottom: 6px solid var(--mustard);
  }
  .top h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.4rem, 8vw, 4.5rem);
    line-height: 1.02;
    letter-spacing: .01em;
    color: var(--mustard);
    text-shadow: 3px 3px 0 var(--ketchup);
  }
  .top p { margin: .9rem auto 1.4rem; max-width: 34ch; font-size: 1.15rem; }

  .btn {
    display: inline-block;
    font-family: var(--body);
    font-weight: 700;
    font-size: 1.05rem;
    text-decoration: none;
    background: var(--ketchup);
    color: #fff4e0;
    padding: .75rem 1.5rem;
    border: 2px solid #fff4e0;
    border-radius: 4px;
    cursor: pointer;
    transition: background .15s, transform .15s;
  }
  .btn:hover { background: #b6331f; transform: translateY(-1px); }

  /* ---------- Category tabs ---------- */
  .tabbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--char);
    border-bottom: 2px solid var(--oak-light);
  }
  .tabs {
    display: flex;
    gap: .25rem;
    max-width: 52rem;
    margin: 0 auto;
    padding: .6rem 1rem;
    overflow-x: auto;
  }
  .tab {
    flex: 1 0 auto;
    font: 700 1rem var(--body);
    color: var(--kraft-light);
    background: transparent;
    border: 2px solid transparent;
    border-radius: 4px;
    padding: .55rem 1.1rem;
    cursor: pointer;
  }
  .tab:hover { border-color: var(--oak-light); }
  .tab[aria-selected="true"] { background: var(--mustard); color: var(--char); }

  /* ---------- Board ---------- */
  main { max-width: 52rem; margin: 0 auto; padding: 1.75rem 1rem 3rem; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .6rem;
    margin-bottom: 1.25rem;
    color: var(--kraft-light);
  }
  .chip {
    font: 600 .95rem var(--body);
    color: var(--kraft-light);
    background: var(--char);
    border: 2px solid var(--oak-light);
    border-radius: 999px;
    padding: .3rem .9rem .3rem .5rem;
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--kraft-light); color: var(--ink); border-color: var(--kraft-light); }

  .board {
    background: var(--kraft);
    background-image:
      radial-gradient(rgba(60,35,15,.07) 1px, transparent 1.5px);
    background-size: 7px 7px;
    border: 3px solid var(--char);
    box-shadow: 0 0 0 6px var(--oak-light), 8px 10px 0 rgba(0,0,0,.35);
    border-radius: 3px;
    padding: 1.5rem 1.25rem;
  }
  .board h2 {
    margin: 0 0 .25rem;
    font-family: var(--display);
    font-weight: 400;
    font-size: 2rem;
    color: var(--ketchup);
  }
  .board .note { margin: 0 0 1.25rem; font-style: italic; }

  .items { list-style: none; margin: 0; padding: 0; }
  .item { padding: .85rem 0; border-top: 2px dashed rgba(43,29,20,.35); }
  .item:first-child { border-top: 0; }
  .row { display: flex; align-items: baseline; gap: .5rem; }
  .name { font-weight: 700; font-size: 1.2rem; }
  .leader { flex: 1; border-bottom: 2px dotted rgba(43,29,20,.55); transform: translateY(-.3rem); min-width: 1rem; }
  .price { font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .desc { margin: .15rem 0 0; max-width: 56ch; }
  .tags { display: inline-flex; gap: .3rem; margin-left: .4rem; vertical-align: middle; }

  .badge {
    display: inline-grid;
    place-items: center;
    width: 1.7rem; height: 1.7rem;
    border-radius: 50%;
    font: 700 .7rem var(--body);
    color: #fff4e0;
    border: 2px solid var(--ink);
  }
  .badge.vegan { background: var(--pickle); }
  .badge.gf { background: var(--oak); }
  .chip .badge { width: 1.5rem; height: 1.5rem; }

  .empty { padding: 1rem 0; font-weight: 600; }

  /* ---------- Footer ---------- */
  footer {
    background: var(--char);
    color: var(--kraft-light);
    text-align: center;
    padding: 2rem 1.25rem 2.5rem;
    border-top: 6px solid var(--mustard);
  }
  footer h2 { margin: 0 0 .5rem; font-family: var(--display); font-weight: 400; color: var(--mustard); font-size: 1.6rem; }
  footer p { margin: .25rem 0; }
  footer .btn { margin-top: 1rem; }

  @media (max-width: 480px) {
    .board { padding: 1.1rem .9rem; }
    .name, .price { font-size: 1.1rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .btn { transition: none; }
  }
</style>
</head>
<body>

<header class="top">
  <h1>Ember &amp; Oak<br>Burger Co.</h1>
  <p>Hand-smashed burgers, cooked over real oak fire.</p>
  <a class="btn" href="tel:+10000000000">Call to order</a>
</header>

<div class="tabbar">
  <div class="tabs" role="tablist" aria-label="Menu categories" id="tabs"></div>
</div>

<main>
  <div class="filters" role="group" aria-label="Dietary filters">
    <button class="chip" id="f-vegan" aria-pressed="false"><span class="badge vegan" aria-hidden="true">VG</span>Vegan</button>
    <button class="chip" id="f-gf" aria-pressed="false"><span class="badge gf" aria-hidden="true">GF</span>Gluten-free</button>
  </div>

  <section class="board" id="panel" role="tabpanel" aria-live="polite"></section>
</main>

<footer>
  <h2>Hungry?</h2>
  <p>12 Cooper Lane, Your Town</p>
  <p>Open daily 11:00–22:00</p>
  <a class="btn" href="tel:+10000000000">Call to order</a>
  <p style="margin-top:1.25rem;font-size:.9rem">GF means the item is gluten-free or can be served on a gluten-free bun. Tell us about any allergies when you order.</p>
</footer>

<script>
  // ====== EDIT HERE ======
  const CURRENCY = "$";

  const MENU = [
    {
      id: "burgers", title: "Burgers",
      note: "All burgers come with fries on the side. Make it a double for 3.00 more.",
      items: [
        { name: "The Ember Classic", price: 9.5, desc: "Smashed beef patty, aged cheddar, pickles, red onion and house sauce on a toasted potato bun.", tags: ["gf"] },
        { name: "Smokehouse", price: 11.5, desc: "Beef patty, smoked bacon, smoked cheddar, crispy onion ring and oak BBQ sauce.", tags: [] },
        { name: "Double Oak", price: 12.5, desc: "Two patties, American cheese, slow-caramelized onions and mustard mayo.", tags: [] },
        { name: "Hot Honey Chicken", price: 10.5, desc: "Buttermilk fried chicken thigh, hot honey, crunchy slaw and dill pickles.", tags: [] },
        { name: "Garden Smash", price: 10, desc: "Plant-based patty, vegan cheese, lettuce, tomato, pickles and smoky ketchup.", tags: ["vegan", "gf"] }
      ]
    },
    {
      id: "sides", title: "Sides",
      note: "Fried in a dedicated fryer with sunflower oil.",
      items: [
        { name: "Skin-on Fries", price: 3.5, desc: "Hand-cut and sea-salted.", tags: ["vegan", "gf"] },
        { name: "Sweet Potato Fries", price: 4.5, desc: "Served with smoky dip.", tags: ["vegan", "gf"] },
        { name: "Onion Rings", price: 4.5, desc: "Thick-cut and beer-battered.", tags: ["vegan"] },
        { name: "Chili Cheese Fries", price: 5.5, desc: "Fries topped with beef chili, melted cheddar and scallions.", tags: ["gf"] },
        { name: "Crunchy Slaw", price: 3, desc: "Cabbage, carrot and apple cider dressing.", tags: ["vegan", "gf"] }
      ]
    },
    {
      id: "drinks", title: "Drinks",
      note: "",
      items: [
        { name: "Fresh Lemonade", price: 3.5, desc: "Squeezed daily, lightly sweet.", tags: ["vegan", "gf"] },
        { name: "Craft Cola", price: 3, desc: "Cane sugar, bottled.", tags: ["vegan", "gf"] },
        { name: "Root Beer Float", price: 5, desc: "Root beer and vanilla ice cream.", tags: ["gf"] },
        { name: "Thick Shake", price: 5.5, desc: "Vanilla, chocolate or salted caramel.", tags: ["gf"] }
      ]
    },
    {
      id: "sweets", title: "Desserts",
      note: "",
      items: [
        { name: "Skillet Cookie", price: 5.5, desc: "Warm chocolate chip cookie with a scoop of vanilla ice cream.", tags: [] },
        { name: "Apple Hand Pie", price: 4.5, desc: "Flaky crust, cinnamon apples, dusted with sugar.", tags: ["vegan"] }
      ]
    }
  ];
  // ====== END EDIT ======

  const LABEL = { vegan: "VG", gf: "GF" };
  const FULL = { vegan: "Vegan", gf: "Gluten-free" };

  const state = { tab: MENU[0].id, vegan: false, gf: false };
  const tabsEl = document.getElementById("tabs");
  const panel = document.getElementById("panel");

  function money(n) { return CURRENCY + n.toFixed(2); }

  function renderTabs() {
    tabsEl.innerHTML = "";
    MENU.forEach(cat => {
      const b = document.createElement("button");
      b.className = "tab";
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(cat.id === state.tab));
      b.textContent = cat.title;
      b.addEventListener("click", () => { state.tab = cat.id; renderTabs(); renderPanel(); });
      tabsEl.appendChild(b);
    });
  }

  function renderPanel() {
    const cat = MENU.find(c => c.id === state.tab);
    const items = cat.items.filter(i =>
      (!state.vegan || i.tags.includes("vegan")) && (!state.gf || i.tags.includes("gf"))
    );

    let html = "<h2>" + cat.title + "</h2>";
    if (cat.note) html += '<p class="note">' + cat.note + "</p>";

    if (!items.length) {
      html += '<p class="empty">Nothing in ' + cat.title.toLowerCase() + " matches those filters. Try turning one off.</p>";
    } else {
      html += '<ul class="items">' + items.map(i => {
        const tags = i.tags.length
          ? '<span class="tags">' + i.tags.map(t =>
              '<span class="badge ' + t + '" title="' + FULL[t] + '" aria-label="' + FULL[t] + '">' + LABEL[t] + "</span>"
            ).join("") + "</span>"
          : "";
        return '<li class="item"><div class="row"><span class="name">' + i.name + tags +
          '</span><span class="leader" aria-hidden="true"></span><span class="price">' + money(i.price) +
          '</span></div><p class="desc">' + i.desc + "</p></li>";
      }).join("") + "</ul>";
    }
    panel.innerHTML = html;
  }

  ["vegan", "gf"].forEach(key => {
    const btn = document.getElementById("f-" + key);
    btn.addEventListener("click", () => {
      state[key] = !state[key];
      btn.setAttribute("aria-pressed", String(state[key]));
      renderPanel();
    });
  });

  renderTabs();
  renderPanel();
</script>
</body>
</html>
